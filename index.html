<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spinning Wheel</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #1e1e2f;
    color: white;
}

#wheelContainer {
    position: relative;
    width: 500px;
    margin: 40px auto;
}

#pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 40px;
}

canvas {
    background: white;
    border-radius: 50%;
}

button {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 18px;
    background: orange;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>🎡 Spinning Wheel</h1>

<div id="wheelContainer">
    <div id="pointer">▼</div>
    <canvas id="wheel" width="500" height="500"></canvas>
</div>

<button id="spinBtn">SPIN</button>

<script>

const options = [
{ title: "Doctor Letter", subtitle: "Safe to Be Left Unsupervised" },
{ title: "Acting IT Support", subtitle: "All printers, WiFi & Excel now yours" },
{ title: "Meeting Minutes", subtitle: "All meetings, indefinite" },
{ title: "KPI Training", subtitle: "6 Months, 06:00 start" },
{ title: "Reply-All Revoked", subtitle: "1 Month across all platforms" },
{ title: "14th & 15th Cheques", subtitle: "Approved... in theory" }
];

const colors = ["#f94144","#f3722c","#f9c74f","#90be6d","#43aa8b","#577590"];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let startAngle = 0;
const arc = Math.PI * 2 / options.length;

function drawWheel() {
    ctx.clearRect(0, 0, 500, 500);

    for (let i = 0; i < options.length; i++) {

        let angle = startAngle + i * arc;

        // slice
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(250, 250);
        ctx.arc(250, 250, 250, angle, angle + arc);
        ctx.fill();

        ctx.save();
        ctx.translate(250, 250);
        ctx.rotate(angle + arc / 2);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";

        // TITLE
        ctx.font = "bold 16px Arial";
        wrapText(options[i].title, 140, -10, 130, 18);

        // SUBTITLE
        ctx.font = "12px Arial";
        wrapText(options[i].subtitle, 140, 25, 130, 14);

        ctx.restore();
    }
}

function wrapText(text, x, y, maxWidth, lineHeight) {
    let words = text.split(" ");
    let line = "";

    for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + " ";
        let width = ctx.measureText(testLine).width;

        if (width > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + " ";
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

function spinWheel() {

    let spinTime = 0;
    let spinTimeTotal = Math.random() * 3000 + 4000;
    let spinAngleStart = Math.random() * 10 + 10;

    function rotate() {

        spinTime += 30;

        if (spinTime >= spinTimeTotal) {
            stopRotate();
            return;
        }

        let spinAngle = spinAngleStart * (1 - spinTime / spinTimeTotal);
        startAngle += spinAngle * Math.PI / 180;

        drawWheel();
        requestAnimationFrame(rotate);
    }

    rotate();
}

function stopRotate() {
    let degrees = startAngle * 180 / Math.PI + 90;
    let arcd = arc * 180 / Math.PI;
    let index = Math.floor((360 - degrees % 360) / arcd);

    let result = options[index];

    document.getElementById("resultTitle").innerText = result.title;
    document.getElementById("resultSubtitle").innerText = result.subtitle;

    document.getElementById("popup").style.display = "flex";
}

document.getElementById("spinBtn").addEventListener("click", spinWheel);

drawWheel();

</script>
<div id="popup" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
">

    <div style="
        background:white;
        color:black;
        padding:30px;
        border-radius:12px;
        text-align:center;
        width:300px;
    ">
        <h2 id="resultTitle"></h2>
        <p id="resultSubtitle"></p>
        <button onclick="closePopup()">OK</button>
    </div>

</div>
</body>
</html>
